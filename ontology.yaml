# ============================================================================
# SEISMOSAIC DOMAIN ONTOLOGY — INITIAL DISCUSSION DRAFT
# ============================================================================
# Notation and composition rules: metamodel.md. See UPSTREAM.md for provenance.
# This is ordered YAML-like notation, not ordinary YAML. Repeated $ref/$refs
# directives and their scope must be preserved.
#
# This fragment defines domain structures, not a runtime implementation.
# The study root and record families are provisional. No level profile is
# assigned yet. References are permissive under the shared metamodel.
# Source-specific field mappings are documented separately in docs/sources.md.
# Standard concept alignment and projection limits: docs/standards.md.
# Seismic estimates follow a small QuakeML BED 1.2 projection; ionospheric
# quantities and interpretation metadata draw on SAO/URSI conventions.
# UTC is the target time scale for these initial examples; source conversions
# and reference information must be documented rather than assumed.
#
# Catalogue entries can retain several origin and magnitude estimates, with
# source-reported preference and estimate provenance. Revision history and
# ionogram products remain open.

<identifier>:
  [source_id]:
    description: "Identifier assigned by the stated source namespace"
    type: string
  [namespace]:
    description: "Catalogue or identifier scheme in which source_id is interpreted; independent of delivery channel"
    type: string

<identity>:
  description: "Primary source identifier and any source-supported additional identifiers of the enclosing record"
  $ref: <_identifier>
  $refs: <identifier>

<time>:
  [instant]:
    description: "Instant expressed as an ISO 8601 UTC timestamp"
    type: string
  [start]:
    description: "Inclusive start of a time interval, expressed in UTC"
    type: string
  [end]:
    description: "Exclusive end of a time interval, expressed in UTC"
    type: string

<position>:
  [latitude]:
    description: "Reported geodetic latitude"
    type: float
    unit: deg
  [longitude]:
    description: "Reported geodetic longitude"
    type: float
    unit: deg
  [datum]:
    description: "Reported horizontal coordinate datum or reference, where known"
    type: string

<quality>:
  [status]:
    description: "Quality, publication or index status in its source vocabulary or an explicitly documented mapping; no universal quality rank"
    type: string
  [evaluation_mode]:
    description: "Source-reported seismic estimate evaluation mode, as in QuakeML; distinct from ionogram scaling"
    type: string
  [scaling]:
    description: "Reported manual or automatic interpretation of an ionogram-derived characteristic"
    type: string
  [confidence_code]:
    description: "Source confidence token retained verbatim, including special scaling codes; interpret against the documented source route"
    type: string
  [confidence_score]:
    description: "GIRO confidence on a documented 0–100 score scale; special source codes such as FastChar CS=999 are excluded"
    type: float
    range: [0, 100]
  [qualifying_letter]:
    description: "Source-reported URSI qualifying letter for the enclosing ionospheric characteristic"
    type: string
  [descriptive_letter]:
    description: "Source-reported URSI descriptive letter for the enclosing ionospheric characteristic"
    type: string
  [flags]:
    description: "Source-reported quality or interpretation flags"
    type: string

<provenance>:
  <producer>:
    [name]:
      description: "Producer of the enclosing scientific record or assertion"
      type: string
    [version]:
      description: "Reported catalogue, product or method version"
      type: string
  <channel>:
    [name]:
      description: "Service or route through which the enclosing record was obtained"
      type: string
    [uri]:
      description: "Public service or source reference"
      type: string
  [reference]:
    description: "Scientific citation, source documentation or other attribution"
    type: string
  [updated_at]:
    description: "Source-reported update time of the enclosing record or estimate, expressed in UTC; not its physical event time or retrieval time"
    type: string

<origin>:
  description: "One origin estimate represented by the enclosing catalogue entry; aligned with QuakeML Origin"
  $ref: <identity>
  $ref: <time>
  $ref: <position>
  $ref: <quality>
  $ref: <provenance>
  [preferred]:
    description: "Whether this is the enclosing catalogue entry's source-selected preferred origin; absent when preference is unknown"
    type: boolean
  [depth]:
    description: "Reported hypocentral depth, positive downward; retain the source's reference"
    type: float
    unit: km
  [depth_reference]:
    description: "Reported reference for depth, where supplied"
    type: string

<magnitude>:
  description: "One magnitude estimate represented by the enclosing catalogue entry; aligned with QuakeML Magnitude"
  $ref: <identity>
  $ref: <quality>
  $ref: <provenance>
  [preferred]:
    description: "Whether this is the enclosing catalogue entry's source-selected preferred magnitude; not a judgement of best physical accuracy"
    type: boolean
  [origin_id]:
    description: "Source-reported identifier of the origin associated with this magnitude; interpreted in the source reference scheme"
    type: string
  [value]:
    description: "Reported earthquake magnitude"
    type: float
  [scale]:
    description: "Reported magnitude scale or type, such as Mw, ML or mb"
    type: string
  [uncertainty]:
    description: "Reported uncertainty of the magnitude estimate"
    type: float

<foF2>:
  description: "Ionogram-derived ordinary-wave critical frequency of the highest F-region stratification; URSI foF2 (code 00)"
  $ref: <quality>
  $ref: <provenance>
  [value]:
    type: float
    unit: MHz
  [uncertainty]:
    description: "Reported uncertainty, where supplied"
    type: float
    unit: MHz

<hmF2>:
  description: "Derived height of the F2-layer peak electron density; retain the derivation method and distinguish it from virtual height h'F2"
  $ref: <quality>
  $ref: <provenance>
  [value]:
    type: float
    unit: km
  [uncertainty]:
    description: "Reported uncertainty, where supplied"
    type: float
    unit: km

<event>:
  description: "A source's seismic catalogue entry, retaining its origin and magnitude estimates and source preferences"
  $ref: <identity>
  $refs: <origin>
  $refs: <magnitude>
  $ref: <quality>
  $ref: <provenance>
  $edges:
    --same_event_as-- <event>@{producer}:{channel}

<station>:
  description: "Observing station as described by its source"
  $ref: <identity>
  $ref: <position>
  $ref: <provenance>
  [name]:
    type: string
  [elevation]:
    description: "Reported station elevation"
    type: float
    unit: m
  [elevation_reference]:
    description: "Reported vertical reference, where supplied"
    type: string

<ionospheric_observation>:
  description: "Ionogram-derived characteristics at a station and time"
  $ref: <identity>
  $ref: <time>
  $ref: <foF2>
  $ref: <hmF2>
  $ref: <quality>
  $ref: <provenance>
  [station_id]:
    description: "Station identifier reported by the characteristic's source"
    type: string
  $edges:
    --observed_at--> <station>@{producer}:{channel}
    --selected_for_comparison_with--> <event>@{producer}:{channel}

<geomagnetic_index>:
  description: "Planetary Kp or ap value over a three-hour UTC interval [time.start, time.end); time.instant does not represent its temporal support"
  $ref: <time>
  $ref: <quality>
  $ref: <provenance>
  [name]:
    description: "Index name; lowercase ap is distinct from daily Ap"
    type: string
    enum: [Kp, ap]
  [value]:
    type: float
  [unit]:
    description: "Index unit interpretation: dimensionless Kp scale or equivalent range in 2 nT for ap"
    type: string

--edge--:
  abstract: true
  description: "Connection assertion between domain records"
  [basis]:
    description: "Criterion or evidence for asserting the connection"
    type: string
  $ref: <provenance>

--observed_at-->:
  $is: --edge--
  description: "The observation refers to the target observing station"

--same_event_as--:
  $is: --edge--
  description: "An explicit assertion that two catalogue entries describe the same physical seismic event; requires identity evidence and assertion provenance"

--selected_for_comparison_with-->:
  $is: --edge--
  description: "The observation is selected for comparison with the target event under explicit criteria; no causal or statistical finding is asserted"

<study>:
  description: "Provisional research-context collection; membership alone does not assert a scientific association"
  $refs: <event>@{producer}:{channel}
  $refs: <station>@{producer}:{channel}
  $refs: <ionospheric_observation>@{producer}:{channel}
  $refs: <geomagnetic_index>@{producer}:{channel}
