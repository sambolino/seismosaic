# ============================================================================
# SEISMOSAIC DOMAIN ONTOLOGY — INITIAL DISCUSSION DRAFT
# ============================================================================
# Notation and composition rules: metamodel.md. See UPSTREAM.md for provenance.
# This is ordered YAML-like notation, not ordinary YAML. Repeated $ref/$refs
# directives and their scope must be preserved.
#
# This fragment defines domain structures, not a runtime implementation.
# The study root and record families are provisional. No level profile is
# assigned yet. References are permissive under the shared metamodel.
# Source-specific field mappings are documented separately in docs/sources.md.
# Standard concept alignment and projection limits: docs/standards.md.
# Seismic estimates follow a small QuakeML BED 1.2 projection; ionospheric
# quantities and interpretation metadata draw on SAO/URSI conventions.
# Record specialization uses the local documentation extension in metamodel.md.
# Scientific quantity contents use composition, not a quantity type hierarchy.
# Selection patterns and comparison windows belong to the workflow layer.
# UTC is the target time scale for these initial examples; source conversions
# and reference information must be documented rather than assumed.
#
# Catalogue entries can retain several origin and magnitude estimates, with
# source-reported preference and estimate provenance. Revision history and
# ionogram products remain open.

<identifier>:
  [source_id]:
    description: "Identifier assigned by the stated source namespace"
    type: string
  [namespace]:
    description: "Catalogue or identifier scheme in which source_id is interpreted; independent of delivery channel"
    type: string

<identity>:
  description: "Primary source identifier and any source-supported additional identifiers of the enclosing record"
  $ref: <_identifier>
  $refs: <identifier>

<time>:
  [instant]:
    description: "Instant expressed as an ISO 8601 UTC timestamp"
    type: string
  [start]:
    description: "Inclusive start of a time interval, expressed in UTC"
    type: string
  [end]:
    description: "Exclusive end of a time interval, expressed in UTC"
    type: string
  [label]:
    description: "Source timestamp labelling an interval-supported value, expressed in UTC; does not by itself establish interval boundaries"
    type: string
  [duration]:
    description: "Documented temporal support duration, where known; distinct from sampling cadence"
    type: float
    unit: s

<position>:
  [latitude]:
    description: "Reported geodetic latitude"
    type: float
    unit: deg
  [longitude]:
    description: "Reported geodetic longitude"
    type: float
    unit: deg
  [datum]:
    description: "Reported horizontal coordinate datum or reference, where known"
    type: string

<quality>:
  [status]:
    description: "Quality, publication or index status in its source vocabulary or an explicitly documented mapping; no universal quality rank"
    type: string
  [evaluation_mode]:
    description: "Source-reported seismic estimate evaluation mode, as in QuakeML; distinct from ionogram scaling"
    type: string
  [scaling]:
    description: "Reported manual or automatic interpretation of an ionogram-derived characteristic"
    type: string
  [confidence_code]:
    description: "Source confidence token retained verbatim, including special scaling codes; interpret against the documented source route"
    type: string
  [confidence_score]:
    description: "GIRO confidence on a documented 0–100 score scale; special source codes such as FastChar CS=999 are excluded"
    type: float
    range: [0, 100]
  [qualifying_letter]:
    description: "Source-reported URSI qualifying letter for the enclosing ionospheric characteristic"
    type: string
  [descriptive_letter]:
    description: "Source-reported URSI descriptive letter for the enclosing ionospheric characteristic"
    type: string
  [flags]:
    description: "Source-reported quality or interpretation flags"
    type: string

<provenance>:
  <producer>:
    [name]:
      description: "Producer of the enclosing scientific record or assertion"
      type: string
    [version]:
      description: "Reported catalogue, product or method version"
      type: string
  <channel>:
    [name]:
      description: "Service or route through which the enclosing record was obtained"
      type: string
    [uri]:
      description: "Public service or source reference"
      type: string
  [reference]:
    description: "Scientific citation, source documentation or other attribution"
    type: string
  [updated_at]:
    description: "Source-reported update time of the enclosing record or estimate, expressed in UTC; not its physical event time or retrieval time"
    type: string
  $ref: <acquisition>
  $ref: <product>
  $ref: <creation>

<creation>:
  description: "Source-reported resource creation metadata, projected from QuakeML CreationInfo where supplied; scoped to the enclosing event or estimate"
  [agency_id]:
    description: "Reported designation of the agency publishing this resource; not automatically its scientific author"
    type: string
  [agency_uri]:
    description: "Reported resource identifier of the publishing agency"
    type: string
  [author]:
    description: "Reported author name for this resource"
    type: string
  [author_uri]:
    description: "Reported resource identifier of this resource's author; retain alongside author name when both are supplied"
    type: string
  [created_at]:
    description: "Reported resource creation time in UTC; distinct from physical origin time, record update time and retrieval time"
    type: string
  [version]:
    description: "Reported resource version from CreationInfo; not an agency, software, method or archive-product version"
    type: string

<platform>:
  [name]:
    description: "Reported observing platform, such as GOES-18"
    type: string

<instrument>:
  [name]:
    description: "Reported observing instrument, such as XRS"
    type: string

<acquisition>:
  description: "Physical observing context of the enclosing scientific data, where supplied; distinct from its product producer and delivery channel"
  $ref: <station>
  $ref: <platform>
  $ref: <instrument>

<product>:
  description: "Reported scientific product identity and processing context"
  [name]:
    type: string
  [version]:
    type: string
  [edition]:
    description: "Reported product edition, such as operational or science_quality; vocabularies remain product-specific"
    type: string
  [processing_level]:
    description: "Reported product processing level; a source label, not a Seismosaic ontology level"
    type: string

<origin>:
  description: "One origin estimate represented by the enclosing catalogue entry; aligned with QuakeML Origin"
  $ref: <identity>
  $ref: <time>
  $ref: <position>
  $ref: <quality>
  $ref: <provenance>
  $refs: <magnitude>
  [preferred]:
    description: "Whether this is the enclosing catalogue entry's source-selected preferred origin; absent when preference is unknown"
    type: boolean
  [depth]:
    description: "Reported hypocentral depth, positive downward; retain the source's reference"
    type: float
    unit: km
  [depth_reference]:
    description: "Reported reference for depth, where supplied"
    type: string

<_magnitude>:
  description: "Shared magnitude-estimate contents; association is represented by the concrete enclosing structure"
  $ref: <identity>
  $ref: <quality>
  $ref: <provenance>
  [preferred]:
    description: "Whether this is the enclosing catalogue entry's source-selected preferred magnitude; not a judgement of best physical accuracy"
    type: boolean
  [value]:
    description: "Reported earthquake magnitude"
    type: float
  [scale]:
    description: "Reported magnitude scale or type, such as Mw, ML or mb"
    type: string
  [uncertainty]:
    description: "Reported uncertainty of the magnitude estimate"
    type: float

<magnitude>:
  description: "One source-associated magnitude under its origin; containment resolves the source origin reference and does not imply shared authorship or preference"
  $ref: <_magnitude>

<unassociated_magnitude>:
  description: "A reported magnitude whose origin association is absent or unresolved in the response; retained at event scope without guessing a parent"
  $ref: <_magnitude>
  [origin_id]:
    description: "Reported origin reference only when its target is absent from the response; omit when no association was reported"
    type: string

<_quantity>:
  description: "Reusable scalar quantity contents; concrete quantities supply their meaning and units"
  $ref: <quality>
  $ref: <provenance>
  [value]:
    type: float
  [uncertainty]:
    description: "Reported scalar uncertainty, where supplied; retain its source interpretation"
    type: float
  [statistic]:
    description: "Reported statistic represented by this value when it is an aggregate; describes output, not a requested calculation"
    type: string

<foF2>:
  description: "Ionogram-derived ordinary-wave critical frequency of the highest F-region stratification; URSI foF2 (code 00)"
  $ref: <_quantity>
  [value]:
    unit: MHz
  [uncertainty]:
    unit: MHz

<hmF2>:
  description: "Derived height of the F2-layer peak electron density; retain the derivation method and distinguish it from virtual height h'F2"
  $ref: <_quantity>
  [value]:
    unit: km
  [uncertainty]:
    unit: km

<Kp>:
  description: "Official planetary geomagnetic activity index on its dimensionless Kp scale; GFZ reports three-hour support, carried by the enclosing time context"
  $ref: <_quantity>
  [value]:
    unit: dimensionless
  [uncertainty]:
    unit: dimensionless

<ap>:
  description: "Equivalent-range index derived from Kp, in units of 2 nT; lowercase ap is distinct from daily Ap"
  $ref: <_quantity>
  [value]:
    unit: "2 nT"
  [uncertainty]:
    unit: "2 nT"

<wavelength_band>:
  [name]:
    description: "Source-reported band label, where supplied"
    type: string
  [lower]:
    type: float
    unit: nm
  [upper]:
    type: float
    unit: nm

<irradiance>:
  description: "GOES XRS soft X-ray irradiance by wavelength band; xrs_a and xrs_b are local band aliases, not delivery channels"
  <{band}>:
    $ref: <_quantity>
    $ref: <wavelength_band>
    [value]:
      unit: "W m-2"
    [uncertainty]:
      unit: "W m-2"
    [observed_value]:
      description: "Reported irradiance before the electron-contamination correction, where supplied"
      type: float
      unit: "W m-2"
    [electron_correction]:
      description: "Reported estimated electron-contamination contribution; retain product definitions and thresholds"
      type: float
      unit: "W m-2"

<event>:
  description: "Common event-record form; concrete event families retain their own scientific time and quantity structures"
  $ref: <identity>
  $ref: <quality>
  $ref: <provenance>
  $edges:
    --same_event_as-- <event>@{producer}:{channel}
    --selected_for_comparison_with--> <event>@{producer}:{channel}

<seismic_event>:
  $is: <event>
  description: "A source's seismic catalogue entry; each origin holds its source-associated magnitudes, with source preferences retained independently"
  $refs: <origin>
  $refs: <unassociated_magnitude>

<station>:
  description: "Observing-site metadata within acquisition provenance; not a compulsory first-level registry record"
  $ref: <identity>
  $ref: <position>
  [name]:
    type: string
  [elevation]:
    description: "Reported station elevation"
    type: float
    unit: m
  [elevation_reference]:
    description: "Reported vertical reference, where supplied"
    type: string

<_sample_context>:
  description: "Reusable acquisition or product-value context; does not instantiate standalone measurement records"
  $ref: <identity>
  $ref: <time>
  $ref: <quality>
  $ref: <provenance>

<observation>:
  description: "Common observation-record form; its concrete scientific containers identify the represented values"
  $ref: <_sample_context>
  $edges:
    --selected_for_comparison_with--> <event>@{producer}:{channel}

<ionospheric_observation>:
  $is: <observation>
  description: "Ionogram-derived characteristics sharing station and time context; station metadata belongs to acquisition provenance"
  $ref: <foF2>
  $ref: <hmF2>

<geomagnetic_index>:
  $is: <observation>
  description: "Planetary Kp/ap values over a three-hour UTC interval [time.start, time.end); carries no observing-station requirement"
  $ref: <Kp>
  $ref: <ap>

<solar_observation>:
  $is: <observation>
  description: "GOES XRS irradiance values sharing product, platform and time context; averaged values retain their temporal support"
  $ref: <irradiance>

<time_series>:
  description: "Common time-series record form; concrete series add quantity containers to the inherited sample context"
  $ref: <identity>
  $ref: <time>
  $ref: <quality>
  $ref: <provenance>
  $edges:
    --selected_for_comparison_with--> <event>@{producer}:{channel}
  [cadence]:
    description: "Source-reported nominal sample spacing, where known; not a promise of gap-free data and not the value's support duration"
    type: float
    unit: s
  <points>:
    type: array
    items:
      $ref: <_sample_context>

<ionospheric_series>:
  $is: <time_series>
  description: "Ionogram-derived characteristic series; station and scaling provenance remain available at their supplied scopes"
  <points>:
    items:
      $ref: <foF2>
      $ref: <hmF2>

<geomagnetic_series>:
  $is: <time_series>
  description: "Planetary Kp/ap series whose samples retain their three-hour UTC intervals; the two scales are not independent observations"
  <points>:
    items:
      $ref: <Kp>
      $ref: <ap>

<solar_irradiance_series>:
  $is: <time_series>
  description: "GOES XRS irradiance series with band-scoped values and quality; operational and science-quality editions remain distinct products"
  <points>:
    items:
      $ref: <irradiance>

<summary>:
  description: "Common summary-output form for reported aggregates; selection patterns and analysis instructions belong to the workflow"
  $ref: <identity>
  $ref: <time>
  $ref: <quality>
  $ref: <provenance>
  [sample_count]:
    description: "Reported number of samples contributing to the summary, where supplied"
    type: integer
  $edges:
    --derived_from--> <observation>@{producer}:{channel}
    --derived_from--> <time_series>@{producer}:{channel}
    --derived_from--> <summary>@{producer}:{channel}

<ionospheric_summary>:
  $is: <summary>
  description: "Already reported ionospheric aggregates; each quantity retains its statistic, units and derivation provenance"
  $refs: <foF2>
  $refs: <hmF2>

<solar_irradiance_summary>:
  $is: <summary>
  description: "Already reported XRS irradiance aggregates; this is not a flare event declaration or an aggregation implementation"
  $refs: <irradiance>

--edge--:
  abstract: true
  description: "Output connection assertion between domain records; workflow patterns are not embedded here"
  [basis]:
    description: "Reported evidence or explanation for this output assertion, not an executable selection rule"
    type: string
  $ref: <provenance>

--same_event_as--:
  $is: --edge--
  description: "An explicit assertion that two catalogue entries describe the same physical seismic event; requires identity evidence and assertion provenance"

--selected_for_comparison_with-->:
  $is: --edge--
  description: "The source event, observation or time series is selected for comparison with the target event under explicit criteria; no causal or statistical finding is asserted"

--derived_from-->:
  $is: --edge--
  description: "The source output was computed from the target data; assert only with supplied derivation evidence and provenance"

<study>:
  description: "Output collection of qualified scientific records; selection patterns remain in the workflow and membership asserts no scientific association"
  $refs: <event>@{producer}:{channel}
  $refs: <observation>@{producer}:{channel}
  $refs: <time_series>@{producer}:{channel}
  $refs: <summary>@{producer}:{channel}
